name: docloop-agent
profile: docloop-platform
runtime:
  language: python
  minimum_python: '3.11'
  graph: langgraph
  checkpoint: sqlite
mode: real
superpowers:
  repository: https://github.com/obra/superpowers.git
  commit: 2ce8aa15d05bd57213e6f746f953aafb7ded7a8b
  enabled: true
  install_path: .docloop/superpowers
  manifest_path: .docloop/superpowers.lock.json
  integrity_policy: editable
skill_runtime:
  docloop_path: .docloop/skills
  bootstrap:
  - superpowers:using-superpowers
  stages:
    spec:
    - docloop:spec-create
    - superpowers:brainstorming
    plan:
    - docloop:project-bootstrap
    - superpowers:using-git-worktrees
    - docloop:plan-create
    - superpowers:writing-plans
    - docloop:checklist-create
    implement:
    - superpowers:test-driven-development
    verify:
    - docloop:test-runner
    - superpowers:verification-before-completion
    review:
    - superpowers:requesting-code-review
    archive:
    - docloop:project-archiving
    - superpowers:finishing-a-development-branch
    recovery:
    - docloop:recovery-diagnosis
    - superpowers:systematic-debugging
limits:
  retries: 3
  repairs: 3
  no_progress: 2
  llm: 30
  tokens: 100000
  tools: 100
  model_rounds: 20
  task_seconds: 600
  run_seconds: 3600
  concurrency: 1
  graph_steps: 50
  circuit_failures: 5
permissions:
  allowed_paths: []
  allowed_commands: []
adapters:
  model: null
  browser: null
  documents:
  - markdown
  coding: null
routing:
  workflow:
  - spec-create
  - plan-create
  - checklist-create
  ui:
  - component-generator
  - frontend-quality-check
  api:
  - api-contract
  backend:
  - backend-code-generator
  security:
  - security-check

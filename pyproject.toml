[project]
name = "docloop-agent"
version = "0.2.0"
description = "Evidence-gated DocLoop orchestration framework"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "oracledb>=3,<27",
    "PyYAML>=6,<7",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
docloop = "docloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docloop"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "playwright>=1.50,<2",
]

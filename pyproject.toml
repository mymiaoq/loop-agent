[project]
name = "docloop-agent"
version = "0.1.0"
description = "Evidence-gated DocLoop orchestration framework"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "PyYAML>=6,<7"]

[project.scripts]
docloop = "docloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docloop"]
